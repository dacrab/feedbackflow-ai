name: Auto-merge Dependabot PRs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Find Dependabot PR and merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const headSha = context.payload.workflow_run.head_sha;

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });

            const pr = prs.find(p => p.head.sha === headSha);
            if (!pr) return core.info(`No open PR found for SHA ${headSha}`);
            if (pr.user.login !== 'dependabot[bot]') return core.info(`PR #${pr.number} is not from Dependabot`);

            const { data: metadata } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            // Check update type from PR title prefix set by dependabot
            const isMajor = pr.title.match(/from \d+\.\d+\.\d+ to \d+\./i) &&
              pr.labels.some(l => l.name === 'dependencies') &&
              pr.title.toLowerCase().includes('major');

            // Fetch dependabot metadata via commits API to check semver
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            core.info(`Merging Dependabot PR #${pr.number}: ${pr.title}`);

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'squash',
            });

            core.info(`PR #${pr.number} merged successfully`);
