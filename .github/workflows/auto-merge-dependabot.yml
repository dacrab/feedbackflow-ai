name: Auto-merge Dependabot PRs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Get PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_NUMBER=$(gh pr list --repo "$REPO" --state open --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number" | head -1)
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Check if Dependabot PR
        id: check
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          LOGIN=$(gh pr view ${{ steps.pr.outputs.number }} --repo "$REPO" \
            --json author --jq '.author.login')
          echo "is_dependabot=$([ "$LOGIN" = "dependabot[bot]" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Fetch Dependabot metadata
        id: metadata
        if: steps.check.outputs.is_dependabot == 'true'
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.pr.outputs.number }}

      - name: Merge minor and patch updates
        if: steps.check.outputs.is_dependabot == 'true' && steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge major github-actions updates
        if: steps.check.outputs.is_dependabot == 'true' && steps.metadata.outputs.update-type == 'version-update:semver-major' && steps.metadata.outputs.package-ecosystem == 'github-actions'
        run: gh pr merge ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
