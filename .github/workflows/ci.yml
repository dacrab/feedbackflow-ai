name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Steps that shell out to `doppler run` need the token in their own env.
    # Declaring it on the CLI install step alone never reached them, so every
    # one of them died with "Doppler Error: you must provide a token".
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # Not SHA-pinned like the other actions; pin it when the real digest is
      # known rather than guessing one.
      - uses: dopplerhq/cli-action@v4

      # Runs before typecheck: `next build` generates next-env.d.ts and
      # .next/types, without which tsc has no Next ambient types.
      - name: Build
        run: doppler run -- bun run build

      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      # A hand-audited palette drifts; this fails instead.
      - name: Contrast
        run: bun run contrast
      # Needs no secrets: env vars and the database are mocked per file.
      # Coverage gates the tenant-isolation modules.
      - name: Test
        run: bun run test:coverage
      - name: Knip
        # The knip script already wraps itself in `doppler run`; wrapping it here
        # too only nested one more Doppler process.
        run: bun run knip
      - name: Drizzle check
        run: bun run db:check
