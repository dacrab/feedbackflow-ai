name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Steps that shell out to `doppler run` need the token in their own env.
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      # Runs before typecheck: `next build` generates next-env.d.ts and
      # .next/types, without which tsc has no Next ambient types.
      - name: Build
        run: doppler run -- bun run build

      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      # A hand-audited palette drifts; this fails instead.
      - name: Contrast
        run: bun run contrast
      # Env vars and the database are mocked per file, so no secrets needed.
      - name: Test
        run: bun run test:coverage
      # The script already wraps itself in `doppler run`.
      - name: Knip
        run: bun run knip
      - name: Drizzle check
        run: bun run db:check
