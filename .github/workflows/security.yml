name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          # Table output, not SARIF: this is a private repo without GitHub
          # Advanced Security, so code scanning is off and upload-sarif can only
          # fail. exit-code below is what actually gates the workflow.
          format: table
          severity: CRITICAL,HIGH
          # One unfixable advisory in a devDependency otherwise redlines the
          # build forever with nothing to do about it.
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
          exit-code: '1'
